[package]
name = "sharkfin-web"
version = "0.5.1"
description = "Browser build of sharkfin: the same protocol core over WebHID"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/dniminenn/sharkfin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
