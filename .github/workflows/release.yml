name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "sharkfin ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
          releaseBody: |
            Alpha. Back up from the Device tab before you rely on it.

            You can also use sharkfin without installing anything, at
            [app.getsharkfin.com](https://app.getsharkfin.com/), in Chrome,
            Edge or another Chromium browser. Same app, same keyboard.

            Plug the keyboard in with a USB cable. There is no config
            interface over 2.4 GHz or Bluetooth.

            **Linux** needs a udev rule before either the app or the browser
            can reach the keyboard. Paste this and replug it:

            ```sh
            echo 'SUBSYSTEM=="hidraw", ATTRS{idVendor}=="3151|379a|374a|38a9|046a|2ea8|145f", MODE="0660", TAG+="uaccess"' \
              | sudo tee /etc/udev/rules.d/70-sharkfin.rules >/dev/null \
              && sudo udevadm control --reload-rules && sudo udevadm trigger
            ```

            Not sure if your board is supported? See
            [docs/BOARDS.md](https://github.com/dniminenn/sharkfin/blob/master/docs/BOARDS.md)
            or [getsharkfin.com/boards](https://getsharkfin.com/boards/).
          args: ${{ matrix.args }}

  # tauri-action creates the release as a draft and each matrix job uploads
  # into it. Publishing it from the build job would expose a release with only
  # one platform's binaries in it, so it is published here instead: once, after
  # all three have finished. A failed build leaves it a draft, which is what
  # you want.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false --prerelease
