name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "sharkfin ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
          releaseBody: |
            Alpha. Back up from the Device tab before you rely on it.

            Plug the keyboard in with a USB cable. There is no config
            interface over 2.4 GHz or Bluetooth.

            **Linux** also needs a udev rule so the app can reach the
            keyboard:

            ```
            # /etc/udev/rules.d/70-sharkfin.rules
            SUBSYSTEM=="hidraw", ATTRS{idVendor}=="3151", MODE="0660", TAG+="uaccess"
            ```

            Then `sudo udevadm control --reload-rules && sudo udevadm trigger`,
            and replug the keyboard.

            Not sure if your board is supported? See
            [docs/BOARDS.md](https://github.com/dniminenn/sharkfin/blob/master/docs/BOARDS.md).
          args: ${{ matrix.args }}
