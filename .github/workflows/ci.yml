name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/src-web

      - name: Support list is current
        run: |
          python3 tools/coverage.py --markdown
          git diff --exit-code docs/BOARDS.md

      - name: Layout and registry lint
        run: python3 tools/lint_layouts.py

      - name: Frontend typecheck & build
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Frontend unit tests
        working-directory: app
        run: npx vitest run

      - name: Rust format
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Install wasm toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Browser build format & lint
        working-directory: app/src-web
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      # The wasm package is generated, not committed, so it has to exist
      # before the frontend can be typechecked against it.
      - name: Browser build
        working-directory: app
        run: |
          npm run web:wasm
          npx tsc -p tsconfig.web.json --noEmit
          npx vite build --config vite.web.config.ts

  build:
    name: Build (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build app (no bundling)
        working-directory: app
        run: |
          npm ci
          npx tauri build --no-bundle
